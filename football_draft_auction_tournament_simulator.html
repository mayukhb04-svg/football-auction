function createRoom() {
  const nameInput = document.getElementById('manager-name').value.trim();
  if (!nameInput) {
    alert("Please enter your manager name!");
    return;
  }
  gameState.myId = 'p_' + Math.random().toString(36).substr(2, 6);
  gameState.hostName = nameInput;
  gameState.myTeamName = nameInput + "'s XI";
  gameState.players = [{ id: gameState.myId, name: nameInput, team: gameState.myTeamName, isHost: true }];
  
  renderLobbyRoom();
}

function joinRoom() {
  const nameInput = document.getElementById('manager-name').value.trim();
  const codeInput = document.getElementById('room-code-input').value.trim().toUpperCase();
  if (!nameInput || !codeInput) {
    alert("Please enter both your name and room code!");
    return;
  }
  gameState.myId = 'p_' + Math.random().toString(36).substr(2, 6);
  gameState.myTeamName = nameInput + "'s XI";
  gameState.roomCode = codeInput;
  gameState.players = [
    { id: 'host_dummy', name: 'Host Manager', team: 'Host XI', isHost: true },
    { id: gameState.myId, name: nameInput, team: gameState.myTeamName, isHost: false }
  ];
  
  renderLobbyRoom();
}

<script>
function startDraftAuction() {
  // Shuffle pool of 200 players and pick a subset for the auction (e.g. players count * 16)
  const totalNeeded = gameState.players.length * 16;
  const shuffled = [...GLOBAL_PLAYERS].sort(() => 0.5 - Math.random());
  gameState.auctionQueue = shuffled.slice(0, Math.max(totalNeeded, 60));
  gameState.currentAuctionIndex = 0;
  
  // Initialize budgets & squads
  gameState.budgets = {};
  gameState.squads = {};
  gameState.formations = {};
  gameState.passedBidders = new Set();
  
  gameState.players.forEach(p => {
    gameState.budgets[p.id] = 1000; // 1,000 Million budget
    gameState.squads[p.id] = [];
  });
  
  setupCurrentPlayerAuction();
  renderAuctionScreen();
}

function setupCurrentPlayerAuction() {
  if (gameState.currentAuctionIndex >= gameState.auctionQueue.length) {
    // Auction finished! Go to squad builder
    transitionToSquadBuilder();
    return;

function placeBid(increment) {
  const myBudget = gameState.budgets[gameState.myId];
  const mySquadCount = gameState.squads[gameState.myId].length;
  if (mySquadCount >= 16) {
    alert("You have already reached the maximum limit of 16 players!");
    return;
  }
  const newBid = gameState.currentBid + increment;
  if (myBudget < newBid) {
    alert("You do not have enough budget for this bid!");
    return;
  }
  
  gameState.currentBid = newBid;
  gameState.highestBidderId = gameState.myId;
  gameState.auctionTimer = 15; // Reset timer on bid
  
  // Simulate AI bids if solo mode
  triggerAIBidsIfNeeded();
  renderAuctionScreen();
}

function passCurrentAuction() {
  gameState.passedBidders.add(gameState.myId);
  // If user passes and no one else is bidding or timer is fast, resolve
  resolveAuctionItem();
}

function triggerAIBidsIfNeeded() {
  // If playing against AI, give AI a chance to counter bid randomly
  gameState.players.forEach(p => {
    if (p.id !== gameState.myId && p.id !== gameState.highestBidderId) {
      if (Math.random() < 0.4 && gameState.budgets[p.id] >= gameState.currentBid + 15 && gameState.squads[p.id].length < 16) {
        gameState.currentBid += 15;
        gameState.highestBidderId = p.id;
        gameState.auctionTimer = 15;
      }
    }
  });
}

function forceNextPlayer() {
  if (gameState.timerInterval) clearInterval(gameState.timerInterval);
  resolveAuctionItem();
}

function resolveAuctionItem() {
  if (gameState.timerInterval) clearInterval(gameState.timerInterval);
  const cp = gameState.auctionQueue[gameState.currentAuctionIndex];
  
  if (gameState.highestBidderId) {
    gameState.budgets[gameState.highestBidderId] -= gameState.currentBid;
    gameState.squads[gameState.highestBidderId].push({ ...cp, cost: gameState.currentBid });
  }
  
  gameState.currentAuctionIndex++;
  setupCurrentPlayerAuction();
  if (gameState.currentAuctionIndex < gameState.auctionQueue.length) {
    renderAuctionScreen();
  }
}

<script>
function simulateNextMatch() {
  // Find first unplayed match in bracket
  let targetMatch = null;
  let targetRoundIdx = -1;
  let targetMatchIdx = -1;

  for (let r = 0; r < gameState.bracket.length; r++) {
    for (let m = 0; m < gameState.bracket[r].matches.length; m++) {
      const match = gameState.bracket[r].matches[m];
      if (match.team1 && match.team2 && match.winner === null) {
        targetMatch = match;
        targetRoundIdx = r;
        targetMatchIdx = m;
        break;
      }
    }
    if (targetMatch) break;
  }

  if (!targetMatch) {
    // Check if tournament is over
    const finalMatch = gameState.bracket[2].matches[0];
    if (finalMatch.winner) {
      const winnerObj = finalMatch.winner === finalMatch.team1.id ? finalMatch.team1 : finalMatch.team2;
      alert(`🏆 TOURNAMENT CHAMPION: ${winnerObj.team} (${winnerObj.name})!`);
      return;
    }
    alert("Please wait or setup previous matches.");
    return;
  }

  // Run Match simulation with rich commentator events
  gameState.currentMatch = targetMatch;
  gameState.matchLog = [];

  const team1Squad = gameState.squads[targetMatch.team1.id] || [];
  const team2Squad = gameState.squads[targetMatch.team2.id] || [];
  
  const rating1 = team1Squad.length ? team1Squad.reduce((acc, p) => acc + p.rating, 0) / team1Squad.length : 85;
  const rating2 = team2Squad.length ? team2Squad.reduce((acc, p) => acc + p.rating, 0) / team2Squad.length : 85;

  let score1 = 0;
  let score2 = 0;

  gameState.matchLog.push(`🎙️ WELCOME to this thrilling knockout clash between ${targetMatch.team1.team} and ${targetMatch.team2.team}!`);
  gameState.matchLog.push(`⏱️ 00' - Referee blows the whistle, and we are underway!`);

  // Simulate minutes
  [14, 28, 41, 56, 72, 88].forEach(min => {
    const rand = Math.random() * 100;
    const advantage = (rating1 - rating2) * 0.8;
    
    if (rand + advantage > 58) {
      score1++;
      const scorer = team1Squad.length ? team1Squad[Math.floor(Math.random() * team1Squad.length)].name : "Star Striker";
      gameState.matchLog.push(`⏱️ ${min}' - GOAL! Magnificent strike by ${scorer} for ${targetMatch.team1.team}! (${score1}-${score2})`);
    } else if (rand - advantage < 38) {
      score2++;
      const scorer = team2Squad.length ? team2Squad[Math.floor(Math.random() * team2Squad.length)].name : "Rival Forward";
      gameState.matchLog.push(`⏱️ ${min}' - GOAL! Stunning counter-attack finish by ${scorer} for ${targetMatch.team2.team}! (${score1}-${score2})`);
    } else if (rand > 80) {
      gameState.matchLog.push(`⏱️ ${min}' - DRAMA! Hard tackle in the box... Yellow card shown to the defender.`);
    } else if (rand < 20) {
      gameState.matchLog.push(`⏱️ ${min}' - Incredible save by the goalkeeper! Score remains level.`);
    }
  });

  // Extra time / penalty tiebreaker if draw
  if (score1 === score2) {
    if (Math.random() > 0.5) {
      score1++;
      gameState.matchLog.push(`⏱️ 90+4' - LATE DRAMA! Penalty awarded in injury time! Converted successfully! (${score1}-${score2})`);
    } else {
      score2++;
      gameState.matchLog.push(`⏱️ 90+4' - EXTRA TIME WINNER! A header at the death! (${score1}-${score2})`);
    }
  }

  targetMatch.score1 = score1;
  targetMatch.score2 = score2;
  targetMatch.winner = score1 > score2 ? targetMatch.team1.id : targetMatch.team2.id;
  
  gameState.matchLog.push(`🏁 FULL TIME: ${targetMatch.team1.team} ${score1} - ${score2} ${targetMatch.team2.team}`);

  // Advance winner to next round if applicable
  if (targetRoundIdx === 0) {
    // Quarters -> Semis
    const semiMatchIdx = Math.floor(targetMatchIdx / 2);
    const isFirstSlot = targetMatchIdx % 2 === 0;
    const winnerObj = targetMatch.winner === targetMatch.team1.id ? targetMatch.team1 : targetMatch.team2;
    if (isFirstSlot) {
      gameState.bracket[1].matches[semiMatchIdx].team1 = winnerObj;
    } else {
      gameState.bracket[1].matches[semiMatchIdx].team2 = winnerObj;
    }
  } else if (targetRoundIdx === 1) {
    // Semis -> Final
    const finalMatch = gameState.bracket[2].matches[0];
    const isFirstSlot = targetMatchIdx === 0;
    const winnerObj = targetMatch.winner === targetMatch.team1.id ? targetMatch.team1 : targetMatch.team2;
    if (isFirstSlot) {
      finalMatch.team1 = winnerObj;
    } else {
      finalMatch.team2 = winnerObj;
    }
  }

  renderMatchSimulationScreen();
}

function renderMatchSimulationScreen() {
  const m = gameState.currentMatch;
  const app = document.getElementById('app');
