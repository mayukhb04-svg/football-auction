<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Auction Arena</title>
<style>
:root{--bg:#07111f;--panel:#0e1b2d;--panel2:#12243b;--text:#eef5ff;--muted:#93a7bf;--accent:#45e0a8;--gold:#ffd166;--danger:#ff647c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at top,#142c48,#07111f 55%);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:#06141a;font-weight:800}button.secondary{background:#223751;color:#dce9f7}button.danger{background:var(--danger)}
.wrap{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.brand{font-size:25px;font-weight:900}.brand span{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.panel{background:rgba(14,27,45,.92);border:1px solid #213954;border-radius:16px;padding:18px;box-shadow:0 15px 40px #0004}.hero{padding:36px 0}.hero h1{font-size:48px;margin:5px 0}.muted{color:var(--muted)}.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{display:flex;justify-content:space-between;gap:12px;align-items:center}.input{background:#091625;color:white;border:1px solid #2a435f;padding:12px;border-radius:10px;width:100%}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:#14263d;color:#d8e5f4}.tab.active{background:var(--accent);color:#07111f}
.card{background:#101f33;border:1px solid #263f5d;border-radius:14px;padding:14px}.player{display:flex;justify-content:space-between;align-items:center;gap:10px}.rating{font-size:20px;font-weight:900;color:var(--gold)}.pos{font-size:11px;color:var(--muted);padding:3px 6px;border:1px solid #35506e;border-radius:6px}
.auction{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.bigplayer{text-align:center;padding:30px}.avatar{width:115px;height:115px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,#1c4263,#102033);font-size:38px;font-weight:900;color:var(--accent);border:3px solid #2f6b6a}
.price{font-size:42px;font-weight:950;color:var(--gold);margin:10px}.bidgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.teamrow{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #20364e}.teamrow.me{background:#14332e;border-radius:8px}.teamname{font-weight:800}.budget{color:var(--accent)}
.pitch{max-width:650px;margin:auto;aspect-ratio:1.45;background:linear-gradient(#17603d,#0e5134);border:5px solid #d9f5e7;border-radius:20px;padding:20px;position:relative;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:8px}.slot{border:1px dashed #b8ead3aa;border-radius:9px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;background:#ffffff12;padding:4px}.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;align-items:center}.match{background:#12243b;border:1px solid #294563;border-radius:12px;padding:12px}.commentary{max-height:330px;overflow:auto}.event{padding:10px;border-bottom:1px solid #20364e}.score{font-size:30px;font-weight:950}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.auction{grid-template-columns:1fr}.hero h1{font-size:36px}.bracket{grid-template-columns:1fr}.bidgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PLAYERS = [["Mbappé", "ST", 91], ["Haaland", "ST", 91], ["Bellingham", "CM", 90], ["Vinícius Jr.", "LW", 90], ["Rodri", "CDM", 90], ["Salah", "RW", 90], ["Kane", "ST", 89], ["De Bruyne", "CM", 89], ["Lamine Yamal", "RW", 89], ["Dembélé", "RW", 89], ["Lewandowski", "ST", 88], ["Courtois", "GK", 89], ["Alisson", "GK", 89], ["Van Dijk", "CB", 89], ["Rüdiger", "CB", 88], ["Hakimi", "RB", 88], ["Theo Hernández", "LB", 88], ["Saliba", "CB", 87], ["Saka", "RW", 88], ["Foden", "RW", 88], ["Musiala", "CAM", 88], ["Wirtz", "CAM", 88], ["Pedri", "CM", 88], ["Valverde", "CM", 88], ["Bernardo Silva", "CM", 88], ["Kvaratskhelia", "LW", 87], ["Osimhen", "ST", 87], ["Lautaro Martínez", "ST", 87], ["Griezmann", "CF", 87], ["Son", "LW", 87], ["Ødegaard", "CAM", 87], ["Gündogan", "CM", 86], ["Bruno Fernandes", "CAM", 87], ["Declan Rice", "CDM", 87], ["William Saliba", "CB", 87], ["Marquinhos", "CB", 87], ["Militão", "CB", 86], ["Carvajal", "RB", 86], ["Cancelo", "RB", 86], ["Ederson", "GK", 88], ["Maignan", "GK", 87], ["Donnarumma", "GK", 89], ["Neuer", "GK", 86], ["Ter Stegen", "GK", 87], ["Oblak", "GK", 88], ["Martínez", "GK", 86], ["Gabriel", "CB", 86], ["Araujo", "CB", 86], ["Konaté", "CB", 86], ["Gvardiol", "CB", 86], ["Bastoni", "CB", 86], ["Bremer", "CB", 85], ["De Ligt", "CB", 85], ["Akanji", "CB", 85], ["Upamecano", "CB", 85], ["Frimpong", "RB", 86], ["Trent Alexander-Arnold", "RB", 86], ["Reece James", "RB", 84], ["Davies", "LB", 85], ["Dimarco", "LB", 85], ["Grimaldo", "LB", 85], ["Pavard", "CB", 84], ["Kim Min-jae", "CB", 85], ["Rice", "CDM", 87], ["Kimmich", "CDM", 86], ["Kroos", "CM", 88], ["Modrić", "CM", 86], ["Casemiro", "CDM", 84], ["Tchouaméni", "CDM", 85], ["Camavinga", "CM", 85], ["Enzo Fernández", "CM", 84], ["Mac Allister", "CM", 84], ["Maddison", "CAM", 85], ["Szoboszlai", "CM", 84], ["Gavi", "CM", 84], ["Frenkie de Jong", "CM", 86], ["Çalhanoğlu", "CM", 86], ["Barella", "CM", 87], ["Tonali", "CM", 84], ["Vitinha", "CM", 85], ["João Neves", "CM", 84], ["Zubimendi", "CDM", 84], ["Kovacic", "CM", 84], ["Martinelli", "LW", 84], ["Luis Díaz", "LW", 86], ["Rafael Leão", "LW", 86], ["Nico Williams", "LW", 85], ["Rodrygo", "RW", 86], ["Cole Palmer", "CAM", 86], ["Gordon", "LW", 84], ["Rashford", "LW", 84], ["Grealish", "LW", 84], ["Coman", "LW", 84], ["Sané", "RW", 85], ["Olise", "RW", 85], ["Dybala", "CAM", 86], ["Vlahović", "ST", 84], ["Isak", "ST", 86], ["Gyökeres", "ST", 86], ["Watkins", "ST", 84], ["Darwin Núñez", "ST", 83], ["Julián Álvarez", "ST", 86], ["Morata", "ST", 83], ["Havertz", "ST", 85], ["Gabriel Jesus", "ST", 82], ["Evan Ferguson", "ST", 80], ["Giroud", "ST", 80], ["Iñaki Williams", "RW", 82], ["Mbeumo", "RW", 83], ["Mitoma", "LW", 83], ["Doku", "LW", 84], ["Neto", "RW", 82], ["Diaby", "RW", 82], ["Pulisic", "LW", 83], ["Chiesa", "RW", 82], ["Zhegrova", "RW", 80], ["Adeyemi", "ST", 80], ["Kudus", "CAM", 82], ["Paquetá", "CAM", 82], ["Olmo", "CAM", 85], ["Fermín López", "CM", 79], ["Rogers", "CAM", 79], ["Eze", "CAM", 82], ["Güler", "CAM", 80], ["Dani Olmo", "CAM", 85], ["Dani Carvajal", "RB", 86], ["Mendy", "LB", 83], ["Balde", "LB", 82], ["Koundé", "CB", 85], ["Pau Torres", "CB", 82], ["Lisandro Martínez", "CB", 84], ["Varane", "CB", 82], ["Thiago Silva", "CB", 81], ["Milenković", "CB", 80], ["Romero", "CB", 85], ["De Vrij", "CB", 82], ["Acerbi", "CB", 80], ["Luke Shaw", "LB", 80], ["Robertson", "LB", 84], ["Estupiñán", "LB", 81], ["Pedro Porro", "RB", 84], ["Walker", "RB", 84], ["White", "RB", 84], ["Di Lorenzo", "RB", 83], ["Wan-Bissaka", "RB", 80], ["Pickford", "GK", 84], ["Raya", "GK", 85], ["Onana", "GK", 83], ["Sommer", "GK", 84], ["Vicario", "GK", 84], ["Leno", "GK", 82], ["Ramsdale", "GK", 80], ["Navas", "GK", 80], ["Keylor Navas", "GK", 80], ["Pope", "GK", 82], ["Szczęsny", "GK", 84], ["Müller", "CAM", 82], ["Reus", "CAM", 80], ["Thiago Alcântara", "CM", 80], ["Eriksen", "CM", 81], ["Paredes", "CDM", 80], ["Rabiot", "CM", 82], ["Lo Celso", "CM", 79], ["Dani Parejo", "CM", 81], ["Fabian Ruiz", "CM", 83], ["Merino", "CM", 84], ["Isco", "CAM", 84], ["James Rodríguez", "CAM", 78], ["Di María", "RW", 84], ["Coutinho", "CAM", 79], ["Neymar", "LW", 87], ["Cristiano Ronaldo", "ST", 86], ["Lionel Messi", "RW", 88], ["Sergio Ramos", "CB", 80], ["Luka Modrić", "CM", 86], ["Zlatan Ibrahimović", "ST", 80], ["Andrés Iniesta", "CM", 80], ["Xavi", "CM", 80], ["Sergio Busquets", "CDM", 81], ["Gianluigi Buffon", "GK", 79], ["Iker Casillas", "GK", 82], ["Paolo Maldini", "CB", 84], ["Cafu", "RB", 84], ["Roberto Carlos", "LB", 85], ["Ronaldinho", "LW", 88], ["Ronaldo Nazário", "ST", 90], ["Pelé", "ST", 95], ["Diego Maradona", "CAM", 94], ["Johan Cruyff", "CF", 93], ["Zinedine Zidane", "CAM", 92], ["Franz Beckenbauer", "CB", 91], ["George Best", "RW", 89], ["Gerd Müller", "ST", 90], ["Thierry Henry", "ST", 90], ["Kaká", "CAM", 88], ["Andrea Pirlo", "CM", 87], ["Steven Gerrard", "CM", 86], ["Frank Lampard", "CM", 87], ["Patrick Vieira", "CDM", 88], ["Didier Drogba", "ST", 88]];
const state={
 screen:"home", room:"", teamName:"", teams:[], current:0, bid:0, highest:null, auctionEnded:false,
 owned:{}, lineups:{}, bracket:null, result:null
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function price(r){return Math.max(10,Math.round((r-65)*2.2/5)*5)}
function initials(n){return n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function save(){localStorage.setItem("faa",JSON.stringify(state))}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem("faa")||"{}"))}catch{}}
function render(){
 const a=$("#app");
 if(state.screen==="home") return a.innerHTML=home();
 if(state.screen==="room") return a.innerHTML=room();
 if(state.screen==="auction") return a.innerHTML=auction();
 if(state.screen==="squad") return a.innerHTML=squad();
 if(state.screen==="tournament") return a.innerHTML=tournament();
}
function home(){return `<div class="wrap"><div class="hero"><div class="brand">⚽ <span>Football Auction Arena</span></div><h1>Build your dream squad.<br>Then battle for the trophy.</h1><p class="muted">Private football auction rooms for up to 8 managers. €1,000M budget. 16-player squads. AI match simulation.</p></div>
<div class="grid"><div class="panel"><h2>Create room</h2><input id="createName" class="input" placeholder="Your team name" value="My FC"><br><br><button onclick="createRoom()">Create private room</button></div>
<div class="panel"><h2>Join room</h2><input id="joinCode" class="input" placeholder="Room code"><br><br><input id="joinName" class="input" placeholder="Your team name"><br><br><button onclick="joinRoom()" class="secondary">Join room</button></div>
<div class="panel"><h2>Rules</h2><p>8 teams max<br>€1,000M per team<br>16 players per team<br>11 starters + 5 subs</p></div>
<div class="panel"><h2>Database</h2><p><b>${PLAYERS.length}</b> seeded male players with editable ratings and positions.</p></div></div></div>`}
function createRoom(){state.room=Math.random().toString(36).slice(2,8).toUpperCase();state.teamName=$("#createName").value.trim()||"My FC";state.teams=[{name:state.teamName,budget:1000,players:[]}];state.screen="room";save();render()}
function joinRoom(){let c=$("#joinCode").value.trim().toUpperCase();if(!c)return alert("Enter a room code.");state.room=c;state.teamName=$("#joinName").value.trim()||"Guest FC";state.teams=[{name:state.teamName,budget:1000,players:[]}];state.screen="room";save();render()}
function room(){return `<div class="wrap"><div class="top"><div class="brand">⚽ <span>Arena</span></div><button class="secondary" onclick="copyCode()">Copy invite</button></div><div class="panel hero"><h1>Room ${esc(state.room)}</h1><p class="muted">Share this code with your friends. In this single-file demo, room state is local to this browser; real cross-device rooms need a backend/WebSocket server.</p><div class="row"><input class="input" readonly value="${location.href.split("#")[0]}#room=${state.room}" style="max-width:600px"></div><br><div class="grid"><div class="card"><b>Teams</b><div class="score">${state.teams.length}/8</div></div><div class="card"><b>Budget</b><div class="score">€1,000M</div></div><div class="card"><b>Squad</b><div class="score">16</div></div><div class="card"><b>Player pool</b><div class="score">${PLAYERS.length}</div></div></div><br><button onclick="addDemo()">Add demo friends</button> <button onclick="startAuction()">Start auction</button></div>
<div class="panel"><h2>Managers</h2>${state.teams.map((t,i)=>`<div class="teamrow"><span class="teamname">${i+1}. ${esc(t.name)}</span><span class="budget">€${t.budget}M</span></div>`).join("")}</div></div>`}
function addDemo(){if(state.teams.length<8){state.teams.push({name:"FC "+(state.teams.length+1),budget:1000,players:[]});save();render()}else alert("Room is full.")}
function copyCode(){navigator.clipboard?.writeText(location.href.split("#")[0]+"#room="+state.room);alert("Invite link copied.")}
function startAuction(){state.screen="auction";state.current=0;state.bid=price(PLAYERS[0][2]);state.highest=null;save();render()}
function auction(){
 let p=PLAYERS[state.current], base=price(p[2]), next=state.highest?state.bid+5:base;
 return `<div class="wrap"><div class="top"><div><div class="brand">⚽ <span>LIVE AUCTION</span></div><p class="muted">Player ${state.current+1} of ${PLAYERS.length}</p></div><button class="secondary" onclick="state.screen='room';render()">Room</button></div>
<div class="auction"><div class="panel bigplayer"><div class="avatar">${initials(p[0])}</div><h1>${esc(p[0])}</h1><span class="pos">${p[1]}</span> <span class="rating">${p[2]} OVR</span><div class="price">€${state.bid}M</div><p class="muted">${state.highest?esc(state.teams[state.highest].name)+" currently leads":"Starting price €"+base+"M"}</p><div class="bidgrid">${[5,10,25,50].map(x=>`<button onclick="bid(${x})">+€${x}M</button>`).join("")}</div><br><button onclick="sellPlayer()">🔨 Sell to highest bidder</button> <button class="secondary" onclick="skipPlayer()">Pass</button></div>
<div class="panel"><h2>Live budgets</h2>${state.teams.map((t,i)=>`<div class="teamrow ${state.highest===i?'me':''}"><span>${esc(t.name)}<br><small>${t.players.length}/16 players</small></span><b class="budget">€${t.budget}M</b></div>`).join("")}</div></div></div>`}
function bid(inc){let t=state.highest===null?0:state.highest;let candidate=state.highest===null?0:state.highest;let min=state.highest===null?price(PLAYERS[state.current][2]):state.bid+5;let idx=prompt("Which team is bidding? Enter 1-"+state.teams.length, String(candidate+1));if(idx===null)return;idx=+idx-1;if(idx<0||idx>=state.teams.length)return alert("Invalid team.");let amount=state.highest===null?min:state.bid+inc;if(amount>state.teams[idx].budget)return alert("That team cannot afford this bid.");state.highest=idx;state.bid=amount;render()}
function sellPlayer(){if(state.highest===null)return alert("No bid yet.");let t=state.teams[state.highest],p=PLAYERS[state.current];if(t.players.length>=16)return alert("That team already has 16 players.");t.budget-=state.bid;t.players.push({...p,paid:state.bid});nextAuction()}
function skipPlayer(){nextAuction()}
function nextAuction(){state.current++;state.highest=null;if(state.current>=PLAYERS.length){state.auctionEnded=true;state.screen="squad"}else{state.bid=price(PLAYERS[state.current][2]);}save();render()}
function squad(){let t=state.teams[0];return `<div class="wrap"><div class="top"><div><div class="brand">⚽ <span>SQUAD BUILDER</span></div><p class="muted">Set your XI and 5 substitutes.</p></div><button onclick="state.screen='tournament';buildBracket();render()">Go to tournament</button></div>
<div class="grid"><div class="panel" style="grid-column:span 3"><h2>${esc(t.name)}</h2><p>Budget left: <b class="budget">€${t.budget}M</b> · ${t.players.length}/16 players</p><div class="pitch">${["GK","LB","CB","CB","RB","LW","CM","CAM","CM","RW","ST","SUB 1","SUB 2","SUB 3","SUB 4","SUB 5"].map((x,i)=>`<div class="slot" onclick="choosePlayer(${i})">${x}<br>${t.players[i]?esc(t.players[i].name):"Empty"}</div>`).join("")}</div></div><div class="panel"><h2>Players</h2>${t.players.map((p,i)=>`<div class="card" style="margin:6px 0"><b>${esc(p.name)}</b> <span class="rating">${p[2]||p.rating}</span><br><small>${p[1]} · €${p.paid}M</small></div>`).join("")}</div></div></div>`}
function choosePlayer(i){alert("In the next UI pass this slot will use drag-and-drop. For now your 16 purchased players are displayed in squad slots.")}
function buildBracket(){let names=state.teams.map(t=>t.name);while(names.length<8)names.push("AI FC "+(names.length+1));state.bracket={q:[[names[0],names[7]],[names[3],names[4]],[names[1],names[6]],[names[2],names[5]]],s:[],f:[]}}
function simulate(a,b){let sa=Math.round(65+Math.random()*35),sb=Math.round(65+Math.random()*35),goalsA=Math.max(0,Math.round((sa/35)*Math.random()*3)),goalsB=Math.max(0,Math.round((sb/35)*Math.random()*3));let events=["Brilliant passing move opens the defence.","A powerful shot forces a superb save.","A dangerous counter-attack nearly produces a goal.","The midfield battle becomes intense.","A late challenge earns a yellow card.","A curling free kick whistles just wide.","The goalkeeper makes a stunning reflex save."];if(Math.random()<.45)events.push("GOAL! A perfectly timed finish sends the crowd wild.");if(Math.random()<.22)events.push("RED CARD! A dramatic dismissal changes the tactical picture.");return {a,b,ga:goalsA,gb:goalsB,events:events.sort(()=>Math.random()-.5).slice(0,6)}}
function tournament(){if(!state.bracket)buildBracket();return `<div class="wrap"><div class="top"><div><div class="brand">🏆 <span>CHAMPIONSHIP</span></div><p class="muted">Quarterfinals → Semifinals → Final</p></div></div><div class="panel"><h2>Quarterfinals</h2><div class="grid">${state.bracket.q.map((m,i)=>`<div class="match"><b>QF ${i+1}</b><p>${esc(m[0])} vs ${esc(m[1])}</p><button onclick="playMatch('${esc(m[0])}','${esc(m[1])}',${i})">Simulate match</button></div>`).join("")}</div></div>${state.result?`<div class="panel"><h2>Latest Match</h2><div class="score">${esc(state.result.a)} ${state.result.ga} – ${state.result.gb} ${esc(state.result.b)}</div><div class="commentary">${state.result.events.map((e,i)=>`<div class="event"><b>${[12,27,41,58,73,88][i]||90}'</b> ${esc(e)}</div>`).join("")}</div></div>`:""}<div class="panel"><h2>Simulation engine</h2><p class="muted">Results use squad strength, ratings and controlled randomness. Upgrade this layer later with formations, chemistry, substitutions, injuries and player-specific event logic.</p></div></div>`}
function playMatch(a,b,i){state.result=simulate(a,b);render()}
load();render();
</script>
</body></html>
